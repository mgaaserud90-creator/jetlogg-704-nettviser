# ===========================================================================
#  MIDLERTIDIG DIAGNOSE - kun lesing.
#
#  Kjoerer hent_og_plott.py i PROVETUR (--test): ingen filer skrives, ingen
#  meldinger merkes, ingenting committes. Poenget er aa se i loggen hvilken
#  konto jobben logger inn som, hvor mange kandidater SEARCH finner, og hvilke
#  vedlegg den eventuelt ville hentet.
#
#  Slettes naar feilsokingen er ferdig.
# ===========================================================================
name: Rigg - diagnose (kun lesing)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sjekk ut repoet
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer avhengigheter
        run: pip install -r rigg/requirements.txt

      - name: Skriv epost.cred fra secrets
        env:
          BRUKER: ${{ secrets.GMAIL_USER }}
          NOKKEL: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          umask 077
          printf 'SMTP_USER=%s\nSMTP_KEY=%s\n' "$BRUKER" "$NOKKEL" > rigg/epost.cred
          echo "hemmelighet: brukernavn ${#BRUKER} tegn, passord ${#NOKKEL} tegn"
          case "$BRUKER" in
            *@gmail.com) echo "brukernavn slutter paa @gmail.com: ja" ;;
            *) echo "brukernavn slutter paa @gmail.com: NEI" ;;
          esac

      - name: Provetur - hva ser runneren i postkassen?
        run: python rigg/hent_og_plott.py --test --json-dir data

      - name: Fjern epost.cred
        if: always()
        run: rm -f rigg/epost.cred
