<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JETLOGG 704 – innlogging</title>
<link rel="icon" href="logo/Seabrokers_Dolomiti_RGB.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="inngang">
  <div class="kort">
    <img class="logo" src="logo/Seabrokers_Dolomiti_RGB.svg"
         alt="Seabrokers Dolomiti">

    <h1>JETLOGG 704 &ndash; peledata</h1>
    <p class="ingress">
      Viser for jetlogg-filene fra riggen. Her finner du kurvene for hver
      enkelt hendelse &ndash; klippede og fulle tidsforløp, pauser, faser og
      stigningstall.
    </p>

    <form id="form" autocomplete="off">
      <div class="felt">
        <label for="passord">Passord</label>
        <input type="password" id="passord" name="passord"
               autocomplete="current-password">
      </div>
      <button type="submit" class="knapp-sjef">Åpne viseren</button>
      <p id="feil" class="feilmelding" role="alert">
        Feil passord. Prøv igjen.
      </p>
    </form>
  </div>
</main>

<script>
(function () {
  "use strict";

  var PASSORD_SHA256 = "678d3e6eb832dc24a1cd5c5e7298c8c0c4e74f15e7fcdfac7cf6bdc32c45ac80";

  function hex(buffer) {
    var b = new Uint8Array(buffer), s = "";
    for (var i = 0; i < b.length; i++) {
      s += (b[i] < 16 ? "0" : "") + b[i].toString(16);
    }
    return s;
  }

  function sum(tekst) {
    var data = new TextEncoder().encode(tekst);
    return crypto.subtle.digest("SHA-256", data).then(hex);
  }

  var form = document.getElementById("form");
  var felt = document.getElementById("passord");
  var feil = document.getElementById("feil");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    feil.classList.remove("vis");
    if (!window.crypto || !window.crypto.subtle) {
      /* http:// på en annen maskin enn localhost er ikke «secure context».
         På Cloudflare Pages (https) og på localhost virker dette. */
      feil.textContent = "Nettleseren nekter å regne sjekksum her "
        + "(siden må kjøres over https eller localhost).";
      feil.classList.add("vis");
      return;
    }
    sum(felt.value).then(function (s) {
      if (s === PASSORD_SHA256) {
        try { sessionStorage.setItem("jetlogg.innlogga", "1"); } catch (e2) {}
        window.location.href = "viser.html";
      } else {
        feil.textContent = "Feil passord. Prøv igjen.";
        feil.classList.add("vis");
        felt.value = "";
        felt.focus();
      }
    }).catch(function () {
      feil.textContent = "Klarte ikke å sjekke passordet i denne nettleseren.";
      feil.classList.add("vis");
    });
  });

  felt.focus();
})();
</script>
</body>
</html>
